<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أستاذي - صانع نماذج الأسئلة الامتحانية</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #0284c7;
      --bg: #f8fafc;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #334155; }
    
    header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--accent); }
    header h1 { margin: 0; font-size: 26px; color: #38bdf8; }
    header p { margin: 6px 0 0 0; color: #94a3b8; font-size: 14px; }

    .container { max-width: 950px; margin: 30px auto; padding: 0 15px; }
    .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 25px; }

    .section-title { border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; color: var(--primary); margin-bottom: 18px; font-weight: bold; font-size: 17px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #475569; }
    input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }

    /* الأزرار */
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
    .btn-add { background: #10b981; color: white; }
    .btn-add:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; font-size: 12px; padding: 5px 10px; }
    .btn-generate { background: var(--primary); color: white; width: 100%; padding: 15px; font-size: 17px; margin-top: 15px; }
    .btn-generate:hover { background: #0f172a; }

    .q-box { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }

    /* تنسيق ورقة الطباعة والمعاينة الرسمية */
    .exam-paper { display: none; background: white; padding: 30px; border: 1px solid #000; margin-top: 20px; font-family: 'Times New Roman', Times, serif; }
    .header-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 15px; }
    .header-table td { padding: 3px; vertical-align: top; }
    
    .question-block { margin-bottom: 12px; font-size: 16px; line-height: 1.5; }
    .sub-question { margin-top: 4px; }

    /* خيارات اللغة الإنجليزية */
    .ltr-mode { direction: ltr; text-align: left; }
    .ltr-mode .sub-question { margin-left: 25px; margin-right: 0; }
    .rtl-mode .sub-question { margin-right: 25px; margin-left: 0; }

    /* إعدادات الطباعة وتحويل PDF */
    @media print {
      body { background: white; margin: 0; }
      header, .card, .btn { display: none !important; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .exam-paper { display: block !important; border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎓 منصة أستاذي (Ostadhi)</h1>
    <p>صانع نماذج الأسئلة الامتحانية القابلة للتعديل الكامل</p>
  </header>

  <div class="container">

    <!-- قسم الإعدادات العامة ولغة الأسئلة -->
    <div class="card">
      <div class="section-title">⚙️ أولاً: الترويسة وإعدادات لغة الأسئلة</div>
      
      <div class="form-group" style="margin-bottom: 15px;">
        <label>لغة ورقة الأسئلة والاتجاه:</label>
        <select id="paperLang" onchange="toggleLanguageMode()">
          <option value="ar">اللغة العربية (من اليمين إلى اليسار)</option>
          <option value="en">English (من اليسار إلى اليمين LTR)</option>
        </select>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label id="lblSchool">اسم المدرسة / الإدارة:</label>
          <input type="text" id="schoolName" value="متوسطة أجيال الغد للبنين">
        </div>
        <div class="form-group">
          <label id="lblSubject">اسم المادة:</label>
          <input type="text" id="subject" placeholder="مثال: اللغة العربية / English">
        </div>
        <div class="form-group">
          <label id="lblGrade">الصف / المرحلة:</label>
          <input type="text" id="grade" placeholder="مثال: الثاني المتوسط">
        </div>
        <div class="form-group">
          <label id="lblExamTitle">عنوان الامتحان / الكورس:</label>
          <input type="text" id="examTitle" value="اسئلة امتحان الكورس الثاني / الدور الأول">
        </div>
        <div class="form-group">
          <label id="lblYear">العام الدراسي:</label>
          <input type="text" id="year" value="2025 - 2026 م">
        </div>
        <div class="form-group">
          <label id="lblExamTime">الوقت / الزمن:</label>
          <input type="text" id="examTime" value="ساعتان">
        </div>
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <label id="lblGeneralNote">ملاحظة الترويسة العامة (تظهر أسفل الجدول):</label>
        <input type="text" id="generalNote" value="ملاحظة: الإجابة عن جميع الأسئلة (لكل سؤال 20 درجة)">
      </div>
    </div>

    <!-- إدخال الأسئلة -->
    <div class="card">
      <div class="section-title">📝 ثانياً: تفاصيل الأسئلة والفرعيات</div>
      <div id="questionsContainer"></div>
      <button type="button" class="btn btn-add" onclick="addQuestion()">+ إضافة سؤال جديد</button>
    </div>

    <!-- إدخال الأسفل والتذييل -->
    <div class="card">
      <div class="section-title">✍️ ثالثاً: التذييل السفلي (تمنيات التوفيق والتوقيع)</div>
      <div class="grid-3">
        <div class="form-group">
          <label id="lblWishText">عبارة التمني / الملاحظة الختامية:</label>
          <input type="text" id="wishText" value="تمنياتنا لكم بالنجاح والتوفيق">
        </div>
        <div class="form-group">
          <label id="lblTeacherName">أستاذ / أستاذة المادة:</label>
          <input type="text" id="teacherName" placeholder="مثال: أ. أحمد فاضل">
        </div>
        <div class="form-group">
          <label id="lblBottomNotice">تنبيه نهاية الصفحة:</label>
          <input type="text" id="bottomNotice" value="انتهت الأسئلة">
        </div>
      </div>

      <button type="button" class="btn btn-generate" onclick="generateAndPrint()">📄 معاينة وتحميل ورقة الأسئلة (PDF / طباعة)</button>
    </div>

    <!-- ورقة المعاينة والطباعة -->
    <div id="examPaper" class="exam-paper rtl-mode">
      
      <!-- هيدر الأسئلة -->
      <table class="header-table">
        <tr>
          <td id="hdrLeft" style="width: 35%; text-align: right;">
            <b>إدارة: </b><span id="pSchool"></span><br>
            <b>المادة: </b><span id="pSubject"></span>
          </td>
          <td style="width: 30%; text-align: center;">
            <b id="pExamTitle" style="font-size: 16px;"></b><br>
            <b>للعام الدراسي: </b><span id="pYear"></span>
          </td>
          <td id="hdrRight" style="width: 35%; text-align: left;">
            <b>الصف: </b><span id="pGrade"></span><br>
            <b>الوقت: </b><span id="pTime"></span>
          </td>
        </tr>
      </table>

      <hr style="border: 0.5px solid #000; margin: 8px 0;">
      <div style="font-weight: bold; margin-bottom: 15px; text-align: center; font-size: 15px;" id="pGeneralNote"></div>

      <!-- الأسئلة -->
      <div id="paperQuestions"></div>

      <!-- التذييل السفلي -->
      <div class="footer-paper">
        <div style="font-weight: bold; font-size: 16px; margin-bottom: 12px;" id="pWishText"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
          <div style="font-weight: bold;" id="pTeacherName"></div>
          <div style="font-weight: bold;" id="pBottomNotice"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    let questionCount = 0;

    function toggleLanguageMode() {
      const lang = document.getElementById('paperLang').value;
      if (lang === 'en') {
        document.getElementById('examTitle').value = "Final Examination / First Term";
        document.getElementById('examTime').value = "2 Hours";
        document.getElementById('generalNote').value = "Note: Answer all questions.";
        document.getElementById('wishText').value = "Good Luck For All";
        document.getElementById('bottomNotice').value = "End of Questions";
      } else {
        document.getElementById('examTitle').value = "اسئلة امتحان الكورس الثاني / الدور الأول";
        document.getElementById('examTime').value = "ساعتان";
        document.getElementById('generalNote').value = "ملاحظة: الإجابة عن جميع الأسئلة (لكل سؤال 20 درجة)";
        document.getElementById('wishText').value = "تمنياتنا لكم بالنجاح والتوفيق";
        document.getElementById('bottomNotice').value = "انتهت الأسئلة";
      }
    }

    function addQuestion() {
      questionCount++;
      const lang = document.getElementById('paperLang').value;
      const qDiv = document.createElement('div');
      qDiv.className = 'q-box';
      qDiv.id = `q_block_${questionCount}`;

      const qLabelText = lang === 'en' ? `Question ${questionCount}:` : `السؤال ${questionCount}:`;
      const titlePlaceholder = lang === 'en' ? 'Question title (e.g., Reading Comprehension / Grammar)' : 'عنوان السؤال (مثال: القواعد / اجب عن جميع الأسئلة)';
      const markPlaceholder = lang === 'en' ? 'Marks (e.g., 20 Marks)' : 'الدرجة (مثال: 20 درجة)';

      qDiv.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label style="margin:0; font-size:15px; color:var(--primary);">${qLabelText}</label>
          <button type="button" class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">حذف السؤال</button>
        </div>
        <div class="grid-2" style="margin-bottom:8px;">
          <input type="text" class="q-title" placeholder="${titlePlaceholder}">
          <input type="text" class="q-mark" placeholder="${markPlaceholder}" style="width:40%;">
        </div>
        
        <div class="sub-container" id="sub_container_${questionCount}"></div>
        
        <button type="button" class="btn btn-add" style="font-size:12px; margin-top:8px; background:#0284c7;" onclick="addSubQuestion(${questionCount})">+ إضافة فرع / نقطة فرعية</button>
      `;
      document.getElementById('questionsContainer').appendChild(qDiv);
    }

    function addSubQuestion(qId) {
      const lang = document.getElementById('paperLang').value;
      const subContainer = document.getElementById(`sub_container_${qId}`);
      const subDiv = document.createElement('div');
      subDiv.style.display = "flex";
      subDiv.style.gap = "8px";
      subDiv.style.marginTop = "6px";

      const symbolPlaceholder = lang === 'en' ? 'Symbol (e.g., Q1 / A)' : 'الفرع (مثال: أ / ب)';
      const textPlaceholder = lang === 'en' ? 'Sub-question text...' : 'نص السؤال الفرعي أو التمرين...';

      subDiv.innerHTML = `
        <input type="text" class="sub-symbol" placeholder="${symbolPlaceholder}" style="width: 20%;">
        <textarea class="sub-text" placeholder="${textPlaceholder}" rows="1"></textarea>
        <input type="text" class="sub-mark" placeholder="الدرجة" style="width: 20%;">
        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">X</button>
      `;
      subContainer.appendChild(subDiv);
    }

    function generateAndPrint() {
      const lang = document.getElementById('paperLang').value;
      const paper = document.getElementById('examPaper');

      if (lang === 'en') {
        paper.className = 'exam-paper ltr-mode';
        document.getElementById('hdrLeft').style.textAlign = 'left';
        document.getElementById('hdrRight').style.textAlign = 'right';
      } else {
        paper.className = 'exam-paper rtl-mode';
        document.getElementById('hdrLeft').style.textAlign = 'right';
        document.getElementById('hdrRight').style.textAlign = 'left';
      }

      // تعبئة الترويسة
      document.getElementById('pSchool').innerText = document.getElementById('schoolName').value;
      document.getElementById('pSubject').innerText = document.getElementById('subject').value;
      document.getElementById('pGrade').innerText = document.getElementById('grade').value;
      document.getElementById('pExamTitle').innerText = document.getElementById('examTitle').value;
      document.getElementById('pYear').innerText = document.getElementById('year').value;
      document.getElementById('pTime').innerText = document.getElementById('examTime').value;
      document.getElementById('pGeneralNote').innerText = document.getElementById('generalNote').value;

      // طباعة الأسئلة
      const paperQContainer = document.getElementById('paperQuestions');
      paperQContainer.innerHTML = '';

      const qBlocks = document.querySelectorAll('#questionsContainer > .q-box');
      qBlocks.forEach((block, index) => {
        const qTitle = block.querySelector('.q-title').value;
        const qMark = block.querySelector('.q-mark').value;
        const qPaperDiv = document.createElement('div');
        qPaperDiv.className = 'question-block';
        
        const floatSide = lang === 'en' ? 'right' : 'left';
        const qPrefix = lang === 'en' ? `<b>Q${index + 1}/ </b>` : `<b>س ${index + 1} / </b>`;
        
        let markText = qMark ? `<span style="float:${floatSide}; font-weight:bold;">[ ${qMark} ]</span>` : '';
        let html = `<div>${qPrefix} ${qTitle} ${markText}</div>`;

        const subDivs = block.querySelectorAll('.sub-container > div');
        subDivs.forEach(sub => {
          const symbol = sub.querySelector('.sub-symbol').value;
          const text = sub.querySelector('.sub-text').value;
          const mark = sub.querySelector('.sub-mark').value;
          let subMarkText = mark ? `<span style="float:${floatSide};">(${mark})</span>` : '';

          if(symbol || text) {
            html += `<div class="sub-question"><b>${symbol}</b> ${text} ${subMarkText}</div>`;
          }
        });

        qPaperDiv.innerHTML = html;
        paperQContainer.appendChild(qPaperDiv);
      });

      // التذييل السفلي
      document.getElementById('pWishText').innerText = document.getElementById('wishText').value;
      
      const teacher = document.getElementById('teacherName').value;
      const teacherLabel = lang === 'en' ? 'Teacher: ' : 'مدرس المادة: ';
      document.getElementById('pTeacherName').innerText = teacher ? `${teacherLabel}${teacher}` : '';
      document.getElementById('pBottomNotice').innerText = document.getElementById('bottomNotice').value;

      document.getElementById('examPaper').style.display = 'block';
      window.print();
    }

    window.onload = function() {
      addQuestion();
    }
  </script>
</body>
</html>
